name: Robo SteamRIP

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "URL específica do jogo (opcional)"
        required: false
        default: ""
      modo:
        description: "Modo de execução"
        type: choice
        required: true
        default: "automatico"
        options:
          - automatico
          - atualizar

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin playwright playwright-stealth
          playwright install chromium

      - name: Executar robô PC
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FORCE_UPDATE: ${{ inputs.modo == 'atualizar' && 'true' || 'false' }}
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            python extrair.py "${{ inputs.url }}"
          else
            python extrair.py
          fi

      - name: Salvar lista de jogos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "jogos.txt"; then
            git add jogos.txt
            git commit -m "Atualiza lista jogos.txt"
            git push
          else
            echo "Nenhuma alteração em jogos.txt"
          fi
