name: Executar Robô PC (Firebase)

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      url_manual:
        description: 'URL do jogo no SteamRIP para testar ou adicionar'
        required: false
        default: ''

jobs:
  extrair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar robo PC
        env:
          FIREBASE_DB_URL: https://k404repacks-pc-default-rtdb.firebaseio.com
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          if [ -n "${{ github.event.inputs.url_manual }}" ]; then
            python extrair.py "${{ github.event.inputs.url_manual }}"
          else
            python extrair.py
          fi

      - name: Salvar lista de jogos no repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jogos.txt || true
          git commit -m "Auto: Lista de jogos PC atualizada" || exit 0
          git push
